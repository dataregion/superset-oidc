#
# COMPOSE_FILE spares every task the two -f flags and makes them independent of the
# current directory. Docker Compose derives the project directory from the first file,
# so the relative paths inside the compose files stay valid.
#
[env]
COMPOSE_FILE = "{{config_root}}/example/docker-compose.yml:{{config_root}}/example/docker-compose.dev.yml"
SUPERSET_URL = "http://localhost:8088"
KEYCLOAK_URL = "http://localhost:8080"
KEYCLOAK_REALM = "superset-dev"

[tasks."dev:up"]
description = "Start the development environment"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose up -d --build "$@"
echo "Superset: $SUPERSET_URL — Keycloak: $KEYCLOAK_URL (admin:admin)"
echo "Users: admin.dev, alpha.dev, gamma.dev, noroles.dev (password equals username)"
"""

[tasks."dev:down"]
description = "Stop the development environment, keeping the databases"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose down --remove-orphans "$@"
"""

[tasks."dev:reset"]
description = "Recreate the environment from empty databases, reimporting the Keycloak realm"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose down --remove-orphans --volumes
docker compose up -d --build
"""

[tasks."dev:restart"]
description = "Restart Superset to pick up code and configuration changes"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose restart superset
"""

[tasks."dev:logs"]
description = "Follow the Superset logs"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose logs -f superset "$@"
"""

[tasks."dev:logs:oidc"]
description = "Follow the superset-oidc logs only"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose logs -f superset | grep --line-buffered superset_oidc
"""

[tasks."dev:shell"]
description = "Open a shell in the Superset container"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose exec superset bash
"""

[tasks."dev:psql"]
description = "Open a psql session on the Superset database"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose exec db psql -U postgres -d superset "$@"
"""

[tasks."dev:roles"]
description = "Show the roles synchronized onto each Superset user"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose exec -T db psql -U postgres -d superset -c "
  select u.username,
         coalesce(string_agg(r.name, ', ' order by r.name), '(none)') as superset_roles,
         d.oidc_roles_json as tracked_oidc_roles
    from ab_user u
    left join ab_user_role ur on ur.user_id = u.id
    left join ab_role r on r.id = ur.role_id
    left join superset_oidc_plugin__userdata d on d.user_id = u.id
   group by u.username, d.oidc_roles_json
   order by u.username;"
"""

[tasks."dev:kc-logout"]
description = "Ask Keycloak to log a user out, triggering a back-channel logout (default: alpha.dev)"
run = """
#!/usr/bin/env bash
set -euo pipefail
user="${1:-alpha.dev}"
token=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
  -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin \
  | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
kcuser=$(curl -sf -H "Authorization: Bearer $token" \
  "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/users?username=$user&exact=true" \
  | python3 -c 'import json,sys; u=json.load(sys.stdin); print(u[0]["id"]) if u else sys.exit("no such user")')
curl -sf -X POST -H "Authorization: Bearer $token" \
  "$KEYCLOAK_URL/admin/realms/$KEYCLOAK_REALM/users/$kcuser/logout"
echo "Back-channel logout requested for $user"
"""

[tasks.test]
description = "Run every end-to-end test against the running development environment"
# Sequential on purpose: `depends` would run these in parallel, and the back-channel test
# logs the user out of every Keycloak session, including the one the login test is using.
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run test:login
mise run test:backchannel-logout
"""

[tasks."test:login"]
description = "Drive a full OIDC login and assert the Superset session is established (default: alpha.dev)"
run = """
#!/usr/bin/env bash
set -euo pipefail
user="${1:-alpha.dev}"
jar=$(mktemp); hdr=$(mktemp)
trap 'rm -f "$jar" "$hdr"' EXIT
req() { curl -s -c "$jar" -b "$jar" -D "$hdr" "$@"; }
loc() {
  local l
  l=$(grep -i '^location:' "$hdr" | tail -1 | tr -d '\\r' | sed 's/^[Ll]ocation: //')
  case "$l" in http*) printf '%s' "$l" ;; *) printf '%s%s' "$SUPERSET_URL" "$l" ;; esac
}

req -o /dev/null "$SUPERSET_URL/login/"
req -o /dev/null "$(loc)"
page=$(req -L "$(loc)")
action=$(printf '%s' "$page" | grep -oP 'action="\\K[^"]+' | head -1 | sed 's/&amp;/\\&/g')
if [ -z "$action" ]; then echo "test:login $user: FAIL (no Keycloak login form)" >&2; exit 1; fi
req -o /dev/null -X POST "$action" \
  --data-urlencode "username=$user" --data-urlencode "password=$user" --data-urlencode credentialId=
req -o /dev/null "$(loc)"   # /authorize: exchanges the code for tokens
req -o /dev/null "$(loc)"   # /login/: creates the user and synchronizes roles

code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$SUPERSET_URL/api/v1/me/")
if [ "$code" != "200" ]; then
  echo "test:login $user: FAIL (/api/v1/me/ returned $code, expected 200)" >&2
  exit 1
fi
echo "test:login $user: PASS"
curl -s -b "$jar" "$SUPERSET_URL/api/v1/me/"
echo
"""

[tasks."test:backchannel-logout"]
description = "Assert a Keycloak-initiated logout terminates the local Superset session (default: gamma.dev)"
# Uses a user of its own, and clears that user's sessions first: when several sessions of
# the same user are live, Keycloak notifies only one of them, and the test would watch a
# session that never receives the logout token.
run = """
#!/usr/bin/env bash
set -euo pipefail
user="${1:-gamma.dev}"
mise run dev:kc-logout "$user" >/dev/null
jar=$(mktemp); hdr=$(mktemp)
trap 'rm -f "$jar" "$hdr"' EXIT
req() { curl -s -c "$jar" -b "$jar" -D "$hdr" "$@"; }
loc() {
  local l
  l=$(grep -i '^location:' "$hdr" | tail -1 | tr -d '\\r' | sed 's/^[Ll]ocation: //')
  case "$l" in http*) printf '%s' "$l" ;; *) printf '%s%s' "$SUPERSET_URL" "$l" ;; esac
}
fail() { echo "test:backchannel-logout $user: FAIL ($1)" >&2; exit 1; }

req -o /dev/null "$SUPERSET_URL/login/"
req -o /dev/null "$(loc)"
page=$(req -L "$(loc)")
action=$(printf '%s' "$page" | grep -oP 'action="\\K[^"]+' | head -1 | sed 's/&amp;/\\&/g')
[ -n "$action" ] || fail "no Keycloak login form"
req -o /dev/null -X POST "$action" \
  --data-urlencode "username=$user" --data-urlencode "password=$user" --data-urlencode credentialId=
req -o /dev/null "$(loc)"
req -o /dev/null "$(loc)"

code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$SUPERSET_URL/api/v1/me/")
[ "$code" = "200" ] || fail "could not log in, /api/v1/me/ returned $code"

mise run dev:kc-logout "$user" >/dev/null

# Keycloak posts the logout token out of band, and the module only drops the local
# session on the next incoming request, so poll instead of checking once.
deadline=$((SECONDS + 15))
while :; do
  code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$SUPERSET_URL/api/v1/me/")
  [ "$code" = "401" ] && break
  [ "$SECONDS" -ge "$deadline" ] && fail "session still alive after 15s, /api/v1/me/ returned $code"
  sleep 1
done
echo "test:backchannel-logout $user: PASS"
"""

[tasks.compose]
description = "Forward arbitrary arguments to docker compose on the development stack"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker compose "$@"
"""

[tasks.build]
description = "Build the package distribution artifacts"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv build "$@"
"""
