[build-system]
requires = ["setuptools >= 42", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-oidc"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask_openid>=1.3.1,<1.4",
    "flask-oidc>=2.2.0,<2.3",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "sqlalchemy>=1.4",
    "psycopg2-binary",
]

[project.scripts]
superset-oidc-sync-db-oidc-roles = "superset_oidc.cli:migrate"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where=["src"]

[dependency-groups]
e2e = [
    "pytest>=8.0",
    "pytest-playwright>=0.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["example/tests"]
addopts = "--tracing=retain-on-failure --screenshot=only-on-failure --output=example/tests/test-results"
markers = [
    "merge_mode: requires the dev stack running with SUPERSET_OIDC_SYNC_MODE=merge (see `mise run test:merge-mode`)",
]